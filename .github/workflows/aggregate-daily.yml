# Roda o job de agregação diária (fase 5.1) uma vez por dia — sem isto,
# CliqueDia/CliqueDiaPorOrigem/CliqueDiaPorReferer nunca são alimentadas
# em produção, e o dashboard fica zerado pra sempre mesmo com o worker
# de cliques (click-worker.yml) gravando normalmente em Clique. O
# dashboard só lê as tabelas agregadas, nunca Clique bruto (ver
# "Dashboard" no Obsidian) — esse job é o único elo entre as duas.
#
# 00:15 UTC: aggregateDay() processa "ontem" por padrão (ver
# aggregate-daily.ts), então rodar logo depois da virada do dia UTC
# garante que o dia anterior já fechou por completo antes de agregar.
# Só DATABASE_URL como secret — este job não toca Redis.
name: Agregação diária de cliques

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mesmo bug do click-worker.yml, encontrado em 2026-08-21: env só no
    # último passo não é suficiente — "prisma generate" também precisa
    # de DATABASE_URL (o config resolve o env eagerly ao carregar) e
    # falhava ali. Job falhou 100% das vezes desde que foi criado por
    # causa disso; env no nível do job corrige.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate -w back

      - run: npm run job:aggregate -w back

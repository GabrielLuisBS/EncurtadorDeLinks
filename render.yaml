# Blueprint do Render para o back do Linkly.
#
# Só o serviço web por decisão consciente (2026-08-21): o worker de
# cliques (fase 4, passo 4.2) ficaria como Background Worker, e o Render
# não oferece plano free pra esse tipo de serviço — só "starter"
# (~$7/mês) pra cima. Decidido adiar o custo em vez de pagar agora.
#
# Em vez de pagar pelo Background Worker, o consumo do Redis Stream roda
# via .github/workflows/click-worker.yml — um cron do GitHub Actions a
# cada 5 minutos chamando "npm run worker:once -w back" (modo drena-e-
# termina de back/src/workers/click.worker.ts), grátis porque o repo é
# público. Ver TODO.md pra decisão e trade-off (latência de até ~5min
# pro clique aparecer no dashboard, contra zero custo extra).
#
# Pra trocar pelo Background Worker real depois: novo serviço no Render,
# type: worker, mesmo buildCommand, startCommand
# "npm run start:worker -w back", plano starter — e desativar o workflow
# do GitHub Actions (os dois consumindo o mesmo grupo ao mesmo tempo não
# quebra nada, mas é redundante).
#
# O comando roda a partir da raiz do repo (não de "back/"), de propósito:
# é um monorepo com npm workspaces, e "npm ci" na raiz é o que resolve o
# lockfile único (package-lock.json) e o node_modules hoisted
# corretamente — rodar dentro de back/ sozinho não vê o workspace. Ver
# [[Stack e Ferramentas]] no Obsidian.
#
# DATABASE_URL e REDIS_URL não têm valor aqui (sync: false) de propósito
# — são segredos, não pertencem a um arquivo versionado. Preencha os dois
# manualmente no dashboard do Render (Environment) depois do primeiro
# deploy, com os mesmos valores do back/.env local (ver back/.env.example
# para o formato e onde pegar cada um).
services:
  - type: web
    name: linkly-back
    runtime: node
    plan: free
    region: ohio # AWS us-east-2 — mesma região do Neon deste projeto, pra reduzir latência de rede (ver benchmark do passo 9.1)
    buildCommand: npm ci && npm run build -w back
    startCommand: npm run start -w back
    healthCheckPath: /metrics
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONT_URL
        sync: false # URL de produção do front (Vercel), definida no passo 10.3
      - key: PUBLIC_BASE_URL
        sync: false # URL pública deste serviço (ex.: https://linkly-back.onrender.com), pra POST /links montar urlCurta certo
      # PORT não entra aqui: o Render injeta a própria variável PORT em
      # todo Web Service, e server.ts já lê process.env.PORT (ver
      # back/src/server.ts) — declarar um valor fixo aqui colidiria com
      # o que o Render atribui de verdade.
